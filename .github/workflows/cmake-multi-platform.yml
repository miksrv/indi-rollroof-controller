name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # The driver targets INDI 2.x; the INDI PPA ships the current release.
    # libnova-dev is needed because the INDI headers include libnova headers
    - name: Install dependencies
      run: |
        sudo add-apt-repository -y ppa:mutlaqja/ppa
        sudo apt-get update
        sudo apt-get install -y cmake libindi-dev libnova-dev

    - name: Run build script
      working-directory: indi-driver
      run: |
        chmod +x build.sh
        ./build.sh

    - name: Check installed files
      run: |
        test -x /usr/bin/indi_rollroof
        test -f /usr/share/indi/indi_rollroof.xml
